name: Construir y verificar Docker con modelo versionado
on:
  workflow_dispatch:
jobs:
  docker-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar dependencias
        run: python -m pip install -r requirements-dev.txt
      - name: Ejecutar pruebas unitarias
        run: python -m pytest -q
      - name: Verificar modelo versionado sin reentrenar
        run: python scripts/check_artifacts.py
      - name: Construir imagen
        run: docker build -t riesgo-crediticio-demo:ci .
      - name: Iniciar contenedor
        run: docker run -d --name riesgo-ci -p 8000:8000 riesgo-crediticio-demo:ci
      - name: Comprobar readiness
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:8000/api/health; then exit 0; fi
            sleep 2
          done
          docker logs riesgo-ci
          exit 1
      - name: Probar prediccion real HTTP
        run: bash scripts/smoke_docker.sh
      - name: Capturar estado final
        if: always()
        run: |
          docker ps -a || true
          docker logs riesgo-ci || true
